<script>
var D=[{"paras":["Шла последняя неделя августа 2025 года. В городе пахло мокрым асфальтом и горячей шаурмой, а я шёл по Тверской без цели и без плана, лишь бы не возвращаться в пустую квартиру.","На переходе загорелся красный. Рядом остановилась девушка в бежевом плаще, с волосами цвета шоколада, собранными в хвост. Я почувствовал знакомый запах духов, и колени у меня подкосились. Сердце бухнуло и застучало где-то в горле.","— Яна? — вырвалось у меня.","Девушка обернулась. Чужое лицо, чужие глаза, вежливое недоумение. Она пожала плечами и отвернулась. Загорелся зелёный, она ушла, а я остался стоять, как столб.","Это случалось всё чаще. В витрине булочной мелькнула её улыбка. В окне автобуса её профиль. В толпе у «Охотного Ряда» кто-то засмеялся её смехом, и я пять минут шёл следом за незнакомой девушкой, пока не понял, что делаю.","Шесть лет я жил без неё. А потом, на днях, столкнулся с ней на улице, и с тех пор она повсюду.","Я достал телефон. Двадцать один сорок. Мне нужно было с кем-то поговорить, пока я не сошёл с ума окончательно. Через двадцать минут я уже звонил в дверь Артёма."],"label":"Пролог","title":"Чужие лица"},{"paras":["— Мне кажется, у меня начинает сносить крышу, — сказал я, не поднимая головы. Рука сама легла на лоб, а взгляд упёрся в пол между ботинками. Голос получился тяжёлым и тягучим, будто чужим. — Я вижу её в каждом, кто проходит мимо. Вот даже сейчас: я вроде бы сижу, разговариваю с тобой, Артём, а передо мной она. Понимаешь? Это уже самое настоящее помешательство.","Артём сидел напротив и смотрел на меня так спокойно, как смотрят на больного, которого давно перестали пугаться.","— Не забивай голову, Ник, — сказал он ровно. — Давай сходим в клуб, развеешься. Ты, как обычно, познакомишься с какой-нибудь девушкой, вы влюбитесь и будете вместе.","Меня передёрнуло. Всё в этих словах бесило: и спокойный голос, и лёгкость, с какой он это произнёс, будто речь шла о том, чтобы сменить рубашку.","— Нет, такой, как она, не найти, — ответил я, и голос дёрнулся, стал нервным. — Давай, скажи мне, что я встречался с разными девушками и чем они были хуже её. Зачем тогда встречался, если люблю только её?","Артём промолчал. Тогда я заговорил сам, и слова пошли, как вода из сорванного крана.","— Знаешь, они не были хуже, — начал я, глядя куда-то сквозь стену. — Я всё время искал кого-то похожего на неё. У Алёны был такой же голос. У Карины такой же вкус губ, пропитанных сигаретами. У Иры такие же волосы. Все были чем-то похожи, но всё равно это была не она.","Я помолчал и добавил тише:","— Последний раз я нормально видел её и разговаривал с ней в две тысячи девятнадцатом. И вот она снова. Эта встреча случилась совсем неожиданно и в самый неподходящий момент. Помнишь, я рассказывал, как спешил на собеседование? Я бежал и наткнулся на неё.","— Помню, — отозвался Артём.","— О боже... — выдохнул я. — Этот запах её духов я не спутаю ни с чем. Правда, я увидел её со спины, но это была она. Прошло шесть лет, и вот я снова вижу её. Шесть лет — это больше двух тысяч дней. Я не считал, но почему-то именно сейчас это число встало в голове. И именно с того момента вижу везде.","Артём поднялся, хлопнул ладонью по подлокотнику.","— Тебе нужно выпить. Минутку, сейчас принесу пива.","Он вышел на кухню. Я слышал, как хлопнула дверца холодильника, как звякнули бутылки.","В комнате громко тикали часы. Раньше я их не замечал. Было десять вечера."],"label":"Глава 1","title":"Помешательство"},{"paras":["— Привет!","Этот голос прозвучал не в комнате. Он прозвучал у меня в голове.","Я обернулся и увидел её на соседнем кресле. Она сидела, закинув ногу на ногу, и курила сигарету, как будто всегда сидела здесь и ждала, пока я замечу. Это была она. Настоящая.","Я смотрел на неё и пытался вспомнить, какой она была при нашей последней встрече. Мне казалось, что я помню каждую черту, но стоило остановиться на чём-то одном, и я уже начинал сомневаться. Только волосы, её взгляд и привычная улыбка были такими же, как в моей памяти.","— Ник, давно не виделись, — сказала она спокойно. — Что с тобой происходит?","— Да, Яна, — ответил я, и в голосе были удивление и грусть. — Это было так давно, и я не могу забыть всё, что было раньше.","Внутри что-то сдавило, словно на грудь положили тяжёлую ладонь.","— Тогда у меня только начинались первые отношения, а ты уже знала, чего хочешь от жизни. Я пытался произвести на тебя впечатление, заинтересовать тебя. Ты была такая взрослая. Не возрастом, нет, а мыслями, идеями, самой жизнью.","Я смотрел на неё бешеными глазами. Что-то вдруг сорвалось, и я почти закричал:","— Знаешь, я всегда любил тебя!","Эхо ударилось о стены и замерло. Я опустил голос, и в нём проступили разочарование и сожаление.","— Мы часто расставались, ругались. Это жизнь, и в этом не было ничего страшного. Мы так же сходились много раз. Мне нравилось находиться с тобой в одной комнате, обнимать тебя, гладить твои волосы, слышать твой запах. Всё это дурманило, придавало какой-то смысл жизни: я живу не один, а с ещё одной жизнью. Мы много смеялись, ходили, держась за руки. Это были мы!","Я вдруг вспомнил один из наших вечеров. Мы сидели на кухне, и она никак не могла понять, идёт ли мне новый цвет волос. Она посмотрела на меня, потом улыбнулась и убрала волосы с лица. Тогда я даже не подумал, что когда-нибудь буду вспоминать эту улыбку и пытаться заново воспроизвести её в голове.","О чём мы тогда говорили, я уже не помню. Помню только, что не хотел уходить. Мне было хорошо просто сидеть рядом с тобой.","Я сделал паузу.","— Сейчас же мы живём разными жизнями. У меня одна...","На лице против воли появилась улыбка, кривая и горькая.","— ...у тебя другая. У тебя получается строить свою жизнь: новый парень, новые отношения, новые улыбки и эмоции.","Я опустил глаза и провёл пальцем по краю стола. Слова застряли в горле.","— У меня же совсем другое. Да, не спорю, есть те же улыбки, те же эмоции, но всё это не то. Они не дают того, что давала мне ты.","Она молчала и курила. Дым тянулся к потолку тонкой серой нитью.","Часы на стене отсчитывали такты, и каждый уносил что-то, чего уже не вернуть."],"label":"Глава 2","title":"Разговор с пустотой"},{"paras":["Дверь распахнулась, и в комнату вошёл Артём с двумя бутылками. Он остановился на пороге.","— Ник, ты с кем разговариваешь? — спросил он удивлённо.","— Да так... сам с собой.","Артём пожал плечами и протянул мне бутылку.","— Держи, вот твоё пиво. И хватит уже думать о ней. Выпей.","Я взял бутылку, обернулся ещё раз. Кресло было пустым. На подлокотнике не осталось ни пепла, ни запаха дыма.","— Блин, что со мной происходит? — выдавил я слабым, севшим голосом. — Мне нужно что-то сделать. Это невыносимо, я не могу так жить.","Я сделал большой глоток, потом ещё один. Алкоголь разошёлся по телу, и голос стал увереннее, хоть и слегка пьяным.","— Ты прав, Артём. Поехали в клуб, развеемся. Может, я смогу забыть всё это.","Мы собрались быстро. Допив пиво, я накинул лёгкую куртку и вышел из квартиры. У лифта я никак не мог попасть пальцем в кнопку вызова. Палец упорно соскальзывал мимо.","— Пойдём пешком, — сказал Артём, глядя на мои мучения. — Спустимся, тут всего пара этажей. Проветришься немного, а то нас не пустят из-за твоего состояния.","Через пятнадцать минут у подъезда нас ждало такси. Оно должно было доставить нас туда, где всё и все растворяются и становятся не теми, кем являются. В машине я допивал бутылку «Bud», которую Артём сунул мне на дорожку. Он же вложил мне в ладонь какую-то таблетку: «Чтоб легче зашло». Я проглотил её, не спрашивая. По радио играла Sia, «Elastic Heart». Я пристально смотрел в окно на проезжающие мимо машины, заглядывал внутрь и в каждой из них видел её. Она преследовала меня и не давала мне покоя. Хотя я сам был в этом виноват.","Дорога до клуба заняла тридцать минут."],"label":"Глава 3","title":"Дорога в никуда"},{"paras":["На входе в клуб нас встретили два охранника, выполнявшие роль фейсконтрольщиков, но зашли мы без всяких затруднений. Второй этаж «Роллинг Стоун» был забит народом, который отрывался и веселился в своё удовольствие.","— Два виски-колы, пожалуйста, — сказал Артём бармену.","Бармен без суеты сделал этот несложный напиток, и мы обменялись: он мне бокал, я ему тысячу рублей. Дальше всё пошло по накатанной: стопка водки, бокал пива, стопка водки, бокал пива, и так снова и снова, пока организм не решил, что я уже достаточно пьян. Музыка добавляла опьянения, свет прожекторов менялся в такт басу и слепил, и вот ты уже в лёгком наркотическом тумане танцуешь среди чужих тел. Вокруг веселье, восторг, и никто не подозревает, почему ты такой. Почему ты влил в себя столько алкоголя и закинулся таблетками. Понимал это только я: мне нужно было заглушить голос, голос «старой-новой» любви. Я глянул на телефон: час ночи. Потом ещё раз: час двадцать. Время то растягивалось, то скакало, как заевшая плёнка.","— Ник, Ниииик, — прошептали мне на ухо. — Я тут. Посмотри на меня, вот же я, у тебя за спиной.","Я обернулся и увидел её силуэт далеко, у стены. Она звала меня. Я начал пробираться сквозь толпу, расталкивая плечи, спины, чьи-то руки с бокалами, но с каждым моим шагом она отдалялась. Всё это были галлюцинации, моё помешательство.","— Ник, ты куда? — услышал я снова. — Вот же я. Почему ты уходишь от меня?","— Но я не ухожу, — сказал я дрожащим пьяным голосом. — Ты же была там, я отчётливо видел, как ты стояла у той сте...","Я не успел договорить. Её губы коснулись моих, и в голове всё перемешалось. Я не мог в это поверить. Вкус её губ, её запах... Это была она. Больше всего на свете мне не хотелось, чтобы эта ночь заканчивалась.","Музыка сменилась на более живую и весёлую. Вокруг нас появилась толпа, люди кричали, прыгали, смеялись, и в этой суматохе я потерял её. Она словно испарилась.","— Ник, ты куда пропал? — Артём вынырнул откуда-то сбоку, красный и мокрый от танцев.","— Артём, я был с ней. Мы смотрели друг на друга, и она меня поцеловала, — выдохнул я. — Ты можешь в это поверить?","Артём поморщился.","— Ник, ты опять за своё? Я для чего тебя сюда привёл? Чтобы ты расслабился и всё это забыл. Отдохни, найди себе девушку на эту ночь и забудь её. Между вами ничего не может быть, она в прошлом.","— Может, ты и прав, — сказал я. — После той встречи я слишком часто стал о ней думать.","— Может, это вообще была не она, — Артём пожал плечами. — Ты же её лица не видел. Мало ли в Москве девушек с таким ароматом духов.","Мне захотелось заехать ему по роже. Но в чём-то он был прав.","— Ты прав, давай выпьем. Бармен, две текилы нам. Мы сегодня отдыхаем.","Я уходил в какое-то непонятное пространство, где не было ни мыслей, ни времени. Мы пили, танцевали с девушками.","— Это наше время, брат! — выкрикнул Артём совсем пьяным голосом. — ВЫПЬЕМ!","Текилу он закусил не лаймом, а поцелуем с очередной незнакомкой. Через минуту они вдвоём куда-то растворились в толпе.","Народа становилось всё больше. И тут я понял, что алкоголь из меня куда-то делся: то ли я протрезвел, то ли так подействовали таблетки Артёма. Я сел за барную стойку, вертел в руке телефон, будто ждал звонка, потом положил его экраном вниз. Через пару минут поднял и посмотрел на экран. Ничего.","Надо выпить.","— Одно пиво, пожалуйста.","Я пил пиво не спеша и прокручивал в голове этот поцелуй. Он не отпускал: вкус губ, дыхание, то, как она на секунду замерла, прежде чем отстраниться.","Телефон завибрировал. Я схватил его так, словно от этого звонка зависело многое. Но нет.","— Здравствуйте! Я уже подъехал, жду вас у входа. Белая «Киа Рио».","Я совсем забыл, что вызывал такси.","— Да, я сейчас подойду.","Я допил пиво, расплатился с барменом и медленным шагом двинулся к выходу, в глупой надежде увидеть её ещё раз, хотя бы мельком, напоследок. Но путь от барной стойки до выхода оказался слишком коротким.","В машине экран телефона снова загорелся. Сообщение от Артёма: «Ты где? Я уже дома. Жена с девчонками у тёщи, приезжай». Я не знал, когда он успел уехать, и не стал выяснять. Домой, в пустую квартиру, мне не хотелось. Я назвал водителю адрес Артёма, попытался не думать о случившемся и попросил сделать музыку погромче. По радио играла знакомая песня группы «Пицца»: «Я иду, пинаю найками воздух»."],"label":"Глава 4","title":"Ночь без неё"},{"paras":["Артём открыл мне в домашних штанах, с мокрыми волосами, будто успел принять душ. Мы устроились на кухне, и он достал виски.","— Артём, вот скажи, ты любил? — спросил я, глядя, как лёд падает в стакан. — Хотя чего я спрашиваю. У тебя прекрасная супруга, и раз вы всё ещё вместе, значит, ты её любишь.","Артём усмехнулся и покрутил стакан в пальцах.","— Ник, по мне, так любви нет. Мы давно вместе, у нас две прекрасные дочки, но любовь давно прошла. Да, мы стараемся её поддерживать, и эта поддержка в наших девчонках. Моё мнение: если бы их не было, мы давно бы разошлись, жили бы отдельно друг от друга, и, возможно, я жил бы сейчас лучше. А может, и хуже, кто знает? Это всего лишь предположения. Мы живём тем, что у нас есть сейчас, и сейчас меня всё устраивает. — Он поднял на меня глаза. — А к чему ты задал этот вопрос?","— Ты ведь знаешь, что я до сих пор не понимаю, что между нами с Яной произошло?","— Я знаю, что вы с Яной расстались. Но ты никогда толком не рассказывал, как это случилось.","— Знаешь, я сам не понимаю, почему всё закончилось. Я вообще не понял, что произошло. Просто одним «солнечным днём» всё остановилось. Остановилось для меня в её словах.","— Что значит «остановилось»? Давай поговорим об этом.","Моя рука потянулась к очередному стакану виски. Я уже не помнил, какому по счёту. Но Артём накрыл стакан ладонью раньше, чем я успел сделать глоток этого терпкого виски, которое пока давало мне силы жить и существовать, хотя голова была пуста.","— Ник, хватит. Мне кажется, тебе уже достаточно, ты дошёл до своей кондиции. Если ты упьёшься ещё больше, ты мне ничего не расскажешь, мы не разберёмся, и уж точно я не смогу тебе помочь. Давай с самого начала. Что у вас произошло?","— Я не знаю, что произошло. Но действительно всё остановилось.","Артём заметил, как задрожал мой голос и как глаза наполнились солёной влагой. Я пытался сдержаться, чтобы не показаться слабым. А если слёзы всё же прорвутся, я скажу, что это алкоголь на меня так действует. Хотя кого я обманываю? Даже здесь я пытаюсь обмануть самого себя, а Артём, кажется, и так всё понял.","— Да, всё закончилось в один день, — выдавил я. — И знаешь, что самое обидное? Всё закончилось онлайн. Понимаешь, она не хотела поговорить. Она хотела закончить всё через этот «Telegram». Он столько всего испортил, что лучше бы его вообще не было.","Я помнил тот вечер: на экране загорелось сообщение от Яны. Я прочитал его несколько раз, прежде чем ответить.","Яна: «Ник, я устала. Я пытаюсь с тобой поговорить, а ты каждый раз уходишь от ответа».","Я: «Давай встретимся и поговорим. Пожалуйста».","Яна: «Я пыталась. Ты обещал, что мы всё обсудим, но так и не пришёл. Прости, я больше не могу».","Я набрал ещё одно сообщение и стёр его. Потом позвонил, но она не ответила.","— И что? Вы даже не поговорили с глазу на глаз?","— Нет, почему же. Уже после всего мы один раз встретились и поговорили. Но это был сухой разговор, в нём не было никаких эмоций. Мы разговаривали как чужие. Она отвечала коротко и почти не смотрела на меня; я искал в её голосе что-нибудь знакомое, но не находил. Я первый раз говорил с человеком, которого знаю и не знаю одновременно.","— Но ты же сам привёл эти отношения к такому результату, — жёстко сказал Артём. — А сейчас ты плачешься. Для чего? Ты хочешь её вернуть, так ведь?","— Да. Знаешь, я очень сильно её люблю.","— Любишь, говоришь? А когда она пыталась с тобой поговорить, ты слушал? — Артём отодвинул стакан. — Ник, я не знаю, можно ли что-то вернуть. Но ты хоть раз спросил, что нужно ей?","— Я не знаю, что делать, — сказал я. — Понимаешь, я иду по улице и вижу её во всех прохожих, в отражении проезжающих машин, в витринах магазинов. Она всё время рядом, словно преследует меня, но её нет. Я последнее время живу иллюзиями. Понимаешь, я это не я. Всё это фикция моего разума.","Я замолчал, потом добавил тише:","— Мне кажется, я всё ещё люблю её, несмотря на то что причинил много боли этому человеку. Ты же меня знаешь. Я никогда не говорил правды, я всегда уходил от ответственности. Но именно с ней я чувствовал себя другим. Мне хотелось за неё переживать, хотелось видеть её улыбку, слышать её смех.","— Остановись, — перебил Артём. — Это не ты говоришь, это алкоголь в тебе говорит. И желание её вернуть. Очнись. Ты не знаешь, что такое забота. Ты никому никогда не помогал, только брал, и всё.","В моей голове пронеслась куча мыслей. О том, что Артём прав. О том, что мне хотелось врезать ему за его правду. Но он действительно был прав, и что я мог сделать? Я никогда ни о ком не заботился. Когда мне следовало просто сесть и выслушать человека, я пытался уйти от разговора. Я боялся трудностей, боялся, что меня затянет туда, откуда не выбраться. Что я за человек? Кто я вообще?","— Ладно, Ник, выпей и расслабься, — смягчился Артём и убрал руку со стакана. — Ты же знаешь, мы с тобой друзья. Я попробую тебе помочь, но ты должен этого хотеть. Не я же свои отношения возвращаю.","— Артём, конечно, я готов сделать всё, лишь бы на секунду увидеть её взгляд. — Я посмотрел на него. — Ты знаешь, какой у неё взгляд? О, эти яркие глаза. Я как сейчас помню: они блестят радужным светом, она стоит напротив меня, улыбается своей блестящей улыбкой и смотрит мне в глаза, а её тонкий нежный голосок шепчет. Понимаешь, он просто шепчет. Я никогда не встречал такой девушки.","— Я всё понимаю, ты красиво говоришь. Попробуй ей позвонить или написать. Прямо сейчас.","— Она меня заблокировала. Я не могу.","— Попробуй с моего телефона. Держи.","Артём протянул мне свой мобильный. Я всё ещё помнил её номер наизусть, эти цифры. Я начал набирать, но на каком-то месте меня остановило что-то. Пальцы онемели. Я просто перестал их чувствовать.","— Ник, в чём дело? Ты не можешь набрать номер или забыл его?","— Артём, я не знаю, что происходит. Я не чувствую пальцев.","— Давай я наберу. Говори номер.","— Нет, не надо, — я отодвинул телефон. — Знаешь, не надо этого делать. Она поймёт, что это я звоню, и не захочет поднимать трубку. Давай не будем усугублять.","— Как скажешь, друг.","Часы на кухне показывали без четверти пять. Когда мы успели прожить эти часы? За окном уже светлело то особенное серое, которое бывает перед рассветом.","— Слушай, если не хочешь сейчас идти домой, останься здесь, — сказал Артём. — Поспишь, а потом решишь, что делать.","Мне хотелось согласиться. Но я подумал, что закрою глаза у него на диване и снова увижу её. Не хотелось, чтобы он ещё и это видел.","— Уже поздно, наверное, я пойду домой. Спасибо, Артём, за встречу. Приятно было снова тебя увидеть, пообщаться. И ты уж извини, что втянул тебя в свои проблемы.","— Мне тоже было приятно тебя видеть. Не думай и не загоняйся, всё пройдёт. До встречи, друг."],"label":"Глава 5","title":"Правда на кухне"},{"paras":["За моей спиной захлопнулась дверь подъезда. На улице моросило, дул холодный ветер, хотя на дворе стояло лето. Я сделал пару шагов в сторону дома. Туман покрывал улицу, и мне с трудом удавалось разглядеть дорогу.","Я сунул руки в карманы и нащупал пачку «Винстона». Вообще-то я не курю. Но в этот момент настроение и организм требовали капли никотина. Я поднял воротник куртки, закурил и пошёл домой, с тяжёлым взглядом и кучей мыслей в голове. Путь был не близкий. Метро ещё не открылось, на такси денег не было, зато было что обдумать, переосмыслить и наконец-то разобраться в себе.","В голове крутился её образ и её последние слова, те, которые я прокручивал сотню раз. А вот свои, те, что должен был сказать ей, так и не произнёс. Может, потому что к тому моменту всё перегорело внутри. Может, я хотел оставить это при себе, чтобы она ничего не знала. А может, я просто трус, и если бы я тогда их произнёс, всё сложилось бы иначе. Но вернуть уже ничего нельзя, время вспять не повернуть, а как бы хотелось. Время не вечно, думал я. Ни её время, ни моё.","Я столько раз представлял нашу встречу. Думал, что спрошу, почему всё так получилось, а потом скажу, как мне её не хватало. Но, может быть, я боялся не того, что она меня не услышит, а того, что услышит и всё равно ничего не изменится.","На асфальте тлела сигарета, с которой я сделал всего пару затяжек. Голова так и не опустела, а сердцу только прибавилось боли. Я зашёл в круглосуточный магазин и на последние деньги взял бутылку водки. До чего я докатился? Буду пить один, да ещё эту водку.","Ночь была слишком длинной, словно играла против меня и хотела мучить всё больше и больше. До дома считанные часы ходьбы, а в голове по-прежнему она. Когда же это меня оставит? Что мне надо сделать с собой, чтобы всё забыть? Где те возможности, которыми пользуешься на компьютере? Где та корзина, в которую перетаскиваешь ненужные файлы, нажимаешь «Очистить», и всё, ничего нет, словно ничего и не было?"],"label":"Глава 6","title":"Серый рассвет"},{"paras":["За этими мыслями я даже не заметил, как оказался у своего подъезда. Дрожащими руками я попытался вызвать лифт. Ключи в кармане начали играть со мной в «найди меня», и это было уже совсем не смешно.","Вот она, моя квартира, теперь пустая. Когда-то меня здесь встречал приятный голос, на кухне готовился ужин, в спальне были разбросаны вещи после утренних сборов на работу. В квартире всегда было как на празднике: хорошее настроение и улыбки. Теперь тут одна пустота, и даже не хотелось включать свет.","По тёмному коридору я прошёл на кухню, не разуваясь. Плевать, что останутся грязные следы. Сейчас ничего не важно.","На стол я поставил бутылку водки из магазина. Рядом лежали листок и ручка. И ещё пистолет. Откуда он взялся в этой квартире, я не понимал. Он лежал на столе так, словно его кто-то подсунул мне. Я смотрел на него долго и не мог отделаться от странного чувства, что он лежит там, только пока я смотрю. Но рука потянулась к нему, и в мыслях уже были курок, выстрел, и всё забыто: чем ты жил, чем дышал и кем был. И, наверное, это был бы самый верный способ освободиться от мучений.","Стопка водки, за ней следующая, потом ещё одна, снова и снова. В итоге бутылка опустела, но организм не отключался и не пьянел. Я взял ручку, подтянул листок ближе. Писать последние слова? Может, своё имя и её, и на этом поставить точку? Рука плавала, листок в глазах начал двоиться. Всё-таки алкоголь подействовал.","Я хотел начать с чего-то простого, как в те вечера, когда мы ещё разговаривали. Но слова путались. В голове письмо складывалось яснее, чем на бумаге. Я смотрел на лист и думал, прочитает ли она когда-нибудь хотя бы одну строчку.","Сквозь расплывшиеся буквы я различил только обрывки: «…спиной друг к другу…» и «…в один такт…». Остальные слова наползали друг на друга.","Я хотел закончить письмо словами «Я тебя люблю», но рука остановилась. Чернила растеклись по бумаге, и я поставил точку.","Я достал телефон и открыл её фотографию. Он уже садился, но я всё не мог оторвать от неё взгляд. Я вспоминал, как запускал руку в её тёмные волосы цвета шоколада. Как касался её нежных мягких губ. Как смотрел в её яркие блестящие глаза. Всё это было. А сейчас я мог только вспоминать.","Я поднял голову и увидел напротив самого себя.","— Боже, я умер? — спросил я.","— Привет, Ник, — сказал Ник Второй. — Ты знаешь меня прекрасно.","— Ты моя совесть?","— Нет. Я твоя боль. Я то, с чем ты живёшь. Помнишь, ты никогда со мной не общался, всегда оставлял в стороне. Но вот пришёл момент, когда нам пора познакомиться поближе.","Я схватился за голову.","— Нет, это всё мои галлюцинации. Этого не может быть. Уйди, уйди, исчезни...","Я кричал, уткнувшись лицом в стол. А когда поднял глаза, напротив уже сидела она. Этого мне ещё не хватало.","— Ну что, Ник, каково тебе теперь? Помнишь, сколько ты мне причинил боли в этой жизни?","Колени подогнулись. Я ухватился за край стола, но крик так и остался внутри. Теперь их было двое, «я» и «она». К моей руке потянулся пистолет, чьи-то пальцы сжали на нём мои и поднесли к виску. Глаза наполнились слезами, но я не плакал, я держался. Я сам ко всему этому пришёл. Я хотел избавиться от мучений, так почему бы не сделать это сейчас, именно так.","Курок. Выстрел. Я падаю на пол, и всё, что успеваю разглядеть, это как они уходят. Уходит боль, уходят воспоминания, уходит всё.","Жаль, что ты не смогла взять меня за руку и просто потянуть вверх.","Я не мог понять, умер я или нет. Улица. Я стоял напротив её окна и видел, как она разговаривает по телефону. Мгновение, и я уже в её комнате. Наверное, я попал в ад, и это моё наказание: видеть, как она радуется и улыбается.","Звонок в дверь. Она побежала открывать так, словно знала, кто там. На пороге стоял незнакомый мне человек. А когда-то на этом месте стоял я. Букет цветов, нежный поцелуй. Они меня не видели, а я видел всё, и от этого становилось тошно. Я попытался встать между ними, чтобы это прекратить, но смог только пройти сквозь них.","Я взял её за руку и потянул к себе. Она не почувствовала. Она слишком крепко прижалась к нему.","И тут что-то внутри сказало мне: «Проснись». Сильные глухие удары по голове, вся картина расплылась, и меня потянуло назад.","Я открыл глаза. Передо мной стояла соседка.","— У тебя дверь была открыта, — сказала она. — Я зашла и увидела, что ты лежишь на полу. У тебя всё хорошо? Может, скорую вызвать?","— Всё хорошо, не стоит беспокоиться.","Голова раскалывалась. Соседка ушла, захлопнув за собой дверь. За окном уже давно рассвело. Время шло дальше, как будто ничего не случилось. На полу валялась ручка, на столе стояла пустая бутылка и лежал листок с непонятными надписями. Пистолета нигде не было, да и откуда ему тут взяться. В голове шумело, но при этом было ощущение какой-то пустоты, словно что-то всё же ушло из меня.","Надо освежиться. Прохладный душ немного привёл меня в чувство, таблетка аспирина доделала остальное, и вроде бы я стал свежим. Но чувство было какое-то странное.","Наверное, я всё-таки освободился. От чего, не помню.","Чувство странное, но какое-то свободное..."],"label":"Глава 7","title":"Двойник"},{"paras":["Я долго думал о том, чем должна закончиться эта история.","Наверное, у каждого из нас было что-то, что хотелось бы пережить иначе. Встретить человека ещё раз. Сказать ему слова, которые тогда так и остались внутри. Или, наоборот, проснуться однажды и больше не чувствовать боли при одном только воспоминании о нём.","Я не знаю, какая концовка правильная. Не знаю даже, чего хотел бы сам. Иногда мне казалось, что я готов на всё, лишь бы увидеть её ещё раз. А иногда я так уставал от мыслей о ней, что хотел просто забыть.","Может быть, всё зависит от того, за что мы держимся и к чему стремимся. Только не всё получается выбрать: даже когда очень хочешь забыть, память может вернуть знакомый голос или запах в самый неподходящий момент.","У этой истории два конца. Какой из них ближе тебе — решай сам. А я до сих пор не знаю, какой выбрал бы для себя."],"label":"Перед финалом","title":"Прежде чем всё закончится"},{"paras":["Через неделю я снова шёл по Тверской. На скамейке у перехода сидела девушка и курила, закинув ногу на ногу. Бежевый плащ, шоколадные волосы, ленивый дымок к небу.","— Привет! — сказала она, не глядя на меня. — Давно не виделись.","Ноги не слушались. Я стоял и смотрел, как дым тонкой серой нитью поднимается к фонарю. Мимо шли люди, и никто не оборачивался. Они не видят её? Или им просто всё равно?","Я не знал, настоящая она или это снова моё помешательство. Хотел подойти, но боялся: вдруг исчезнет. Хотел уйти, но боялся ещё сильнее: вдруг останется.","Я столько раз представлял, что встречу её снова. Думал, что сразу подойду, спрошу, как она жила все эти годы, скажу то, что давно хотел сказать. Теперь она сидела передо мной, а я не мог даже понять, рад я или мне страшно.","Мне хотелось, чтобы она осталась. И в то же время я помнил, как ещё недавно просил её уйти из моей головы. Что же я хотел на самом деле?","Мимо с рёвом проехал автобус, и скамейка на секунду скрылась за ним. Когда он проехал, она всё ещё сидела там. По крайней мере, мне так казалось. Я бы не поклялся, что она там на самом деле.","Пока автобус проезжал мимо, я боялся, что скамейка окажется пустой. А когда снова её увидел, не почувствовал облегчения. Просто стоял и смотрел, не зная, что делать дальше.","— Привет, — сказал я и сел рядом.","Время не вечно. Но иногда оно ходит по кругу."],"id":"b","label":"Глава 8","title":"Давно не виделись"},{"paras":["Через неделю я снова шёл по Тверской. Тот же переход, красный свет, и рядом, как нарочно, девушка с волосами цвета шоколада. Я привычно ждал, что сердце ёкнет. Но оно не ёкнуло. Я смотрел на неё и ждал, но не чувствовал ничего, кроме лёгкой усталости.","Дома я достал из кармана куртки смятый листок. Моим почерком, расплывшимся от алкоголя, там было написано письмо. Слова про «один такт» и «спиной друг к другу». Я снова разобрал эти обрывки, но не узнавал их, будто писал другой человек, для которого эта история была важна.","Я открыл телефон, нашёл фотографию. Красивая девушка с тёмными волосами улыбалась в камеру. Я долго смотрел на неё и пытался вспомнить, как её зовут.","Имя вертелось на языке. Я знал, что оно начинается на «Я». Помнил запах её духов, слышал её смех. Но имя не приходило.","Я нажал «Удалить» и подтвердил. Всплыло окошко: «Очистить корзину?»","— Да, — сказал я вслух.","Часы на стене тикали. Время не вечно, но оно умеет лечить. А может, просто стирать. Я ещё долго сидел на кухне и не мог понять, чего во мне больше: облегчения или страха. Корзина была пуста. Только я больше не помнил, что в ней лежало."],"id":"a","alt":1,"label":"Глава 8 · другой финал","title":"Корзина пуста"},{"paras":["Я вижу в каждой встречной — ты.\nВ дожде, в стекле, в чужом дыму.\nБегу за ней, ловлю черты —\nИ понимаю: ни к чему.","Ты поцелуем обожгла\nИ растворилась в суете.\nКак будто вовсе не была —\nЛишь привкус дыма на губе.","Нажать «Очистить» — и исчезнет след,\nПоследний снимок скрыт за темнотой.\nЕго в телефоне больше нет,\nИ я не помню, кто была со мной.","Но время не вечно, и дождь за окном\nСтучит, как когда-то стучал при тебе.\nЯ имя твоё позабуду потом,\nНо голос твой всё ещё слышится мне."],"id":"p","poem":1,"label":"Послесловие","title":"Очистить"}],M={},root=document.documentElement,cur=-1,order=[],bI=-1,aI=-1,pI=-1;

var fs=parseInt(ld('bk_fs')||'19',10);function setFs(n){fs=Math.max(16,Math.min(28,n));root.style.setProperty('--fs',fs+'px');sv('bk_fs',fs)}setFs(fs);

 cur=i;var c=D[i];$('cover').hidden=true;$('reader').hidden=false;$('toc').classList.remove('on');
 var a=$('art');a.textContent='';a.appendChild(mk('div','lbl',c.label));a.appendChild(mk('h1','',c.title));
 c.paras.forEach(function(p){var e=mk('p',c.poem?'poem':(p.indexOf('— ')===0?'dlg':''),p);a.appendChild(e)});
 $('ht').textContent=c.label+' · '+c.title;
 var n=$('nav');n.textContent='';var pos=order.indexOf(i),prev,next;

 var bp=mk('button','btn ghost',prev>=0?'← Назад':'← Обложка');bp.onclick=function(){prev>=0?go(prev):(location.hash='')};n.appendChild(bp);
 if(c.id==='b'){var al=mk('button','btn ghost','Другой финал: «Корзина пуста»');al.onclick=function(){go(aI)};n.appendChild(al)}
 if(c.id==='a'){var bb=mk('button','btn ghost','Вернуться к финалу «Давно не виделись»');bb.onclick=function(){go(bI)};n.appendChild(bb)}
 if(next>=0){var bn=mk('button','btn','Дальше →');bn.onclick=function(){go(next)};n.appendChild(bn)}
 sv('bk_pos',i);window.scrollTo(0,0);upd();
}
function upd(){if(cur<0)return;var h=document.documentElement.scrollHeight-innerHeight,f=h>0?Math.min(1,scrollY/h):1,pos=Math.max(0,order.indexOf(cur));$('prog').style.width=(((pos+f)/order.length)*100)+'%'}
function route(){var m=/^#ch(\d+)$/.exec(location.hash);if(m&&D[+m[1]])show(+m[1]);else{cur=-1;$('cover').hidden=false;$('reader').hidden=true;window.scrollTo(0,0)}}
window.addEventListener('hashchange',route);window.addEventListener('scroll',upd);

$('tocB').onclick=openT;$('tocR').onclick=openT;$('tocX').onclick=function(){$('toc').classList.remove('on')};
